name: "Festival exhibition master (24p) — ProRes 422 HQ, 1080p24, Rec709, 48k"
description: >
  International / DCP-source variant of the ProRes exhibition master at 24 fps
  (DCP standard, most non-European cinema delivery). ProRes 422 HQ MOV, 1080p24,
  Rec.709, PCM 48 kHz stereo. For 2K/4K masters bump width/height (2048x1080,
  3840x2160). Loudness flagged, not failed — confirm the festival's tech sheet.
  Sources in the repo README.
requirements:
  container:      { field: container_all, op: in,    expected: [mov, "mov,mp4,m4a,3gp,3g2,mj2"], severity: fail }
  video_codec:    { field: video.codec,   op: in,    expected: [prores],           severity: fail }
  prores_profile: { field: video.profile, op: in,    expected: ["HQ", "422 HQ"],   severity: warn }
  width:          { field: video.width,   op: eq,    expected: 1920,               severity: fail }
  height:         { field: video.height,  op: eq,    expected: 1080,               severity: fail }
  fps:            { field: video.fps,      op: eq,    expected: 24, tolerance: 0.01, severity: fail }
  scan:           { field: video.field_order, op: in, expected: [progressive, unknown], severity: warn }
  pix_fmt:        { field: video.pix_fmt,  op: in,    expected: [yuv422p10le],      severity: warn }
  color:          { field: video.color_primaries, op: in, expected: [bt709, unknown], severity: warn }
  audio_codec:    { field: audio.codec,    op: in,    expected: [pcm_s16le, pcm_s24le], severity: fail }
  audio_channels: { field: audio.channels, op: eq,    expected: 2,                  severity: fail }
  sample_rate:    { field: audio.sample_rate, op: eq, expected: 48000,             severity: fail }
  loudness:       { field: loudness.integrated_lufs, op: range, expected: [-24, -22], severity: warn }
  true_peak:      { field: loudness.true_peak_dbtp,  op: max,   expected: -1.0,    severity: warn }
